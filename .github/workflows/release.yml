name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          test -n "$version"
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Validate public release configuration
        run: |
          test "${GITHUB_REPOSITORY}" = "galaxywk223/zhixu"

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Build native importer
        shell: pwsh
        run: ./tool/build_native.ps1 -Release
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Test native importer
        shell: pwsh
        run: cargo test --manifest-path native/tomatodo_importer/Cargo.toml
      - run: flutter build windows --release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ needs.validate.outputs.version }}" installer\zhixu.iss'
      - name: Validate installer output
        shell: pwsh
        run: |
          $installer = Get-Item "dist\Zhixu-Setup-*.exe"
          if ($installer.Length -le 0) { throw '安装器为空' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/Zhixu-Setup-*.exe
            dist/Zhixu-Setup-*.exe.sha256

  publish:
    needs: [validate, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Create update manifest
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          installer="Zhixu-Setup-${VERSION}.exe"
          test -f "release-assets/${installer}"
          test -f "release-assets/${installer}.sha256"
          sha256="$(awk '{print $1}' "release-assets/${installer}.sha256")"
          [[ "${sha256}" =~ ^[0-9a-f]{64}$ ]]
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${installer}"
          jq -n \
            --arg version "${VERSION}" \
            --arg notes "知序 v${VERSION} Windows 预览版。专注记录与手动待办已完全分离；历史自动番茄任务会软删除。新增托盘驻留、Windows 单实例、Noto Sans SC 字体和统一桌面界面。云同步安全凭据和代码签名仍待正式验收。" \
            --arg releaseUrl "${release_url}" \
            --arg fileName "${installer}" \
            --arg downloadUrl "${download_url}" \
            --arg sha256 "${sha256}" \
            --argjson size "$(stat -c%s "release-assets/${installer}")" \
            '{schemaVersion: 1, version: $version, notes: $notes, releaseUrl: $releaseUrl, assets: {windows: {fileName: $fileName, downloadUrl: $downloadUrl, sha256: $sha256, size: $size}}}' \
            > release-assets/update-manifest.json
          jq -e '.schemaVersion == 1 and .assets.windows.size > 0' release-assets/update-manifest.json > /dev/null
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          body: |
            ## 预览版说明

            - 专注记录与手动待办完全分离，番茄导入不再创建、修改或关联待办。
            - 历史自动番茄任务会软删除，已有专注和生活事件继续保留。
            - 新增系统托盘驻留和 Windows 单实例，重复启动会激活已有窗口。
            - 内置 Noto Sans SC，统一重构侧栏、排版、列表、统计和全局搜索。
            - 云同步与系统安全凭据存储尚未完成正式验收，当前版本默认使用本地模式。
            - Windows 安装包暂未代码签名，SmartScreen 可能显示未知发布者。
          files: release-assets/*
