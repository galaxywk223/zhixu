name: Validate and package Windows

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --manifest-path native/tomatodo_importer/Cargo.toml -- --check
      - run: cargo test --manifest-path native/tomatodo_importer/Cargo.toml
      - run: cargo build --release --manifest-path native/tomatodo_importer/Cargo.toml
      - name: Validate tagged sync configuration
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if (-not $env:SUPABASE_URL -or -not $env:SUPABASE_ANON_KEY) {
            throw 'Tagged builds require SUPABASE_URL and SUPABASE_ANON_KEY secrets.'
          }
      - run: pnpm build:windows
      - name: Build NSIS package
        run: pnpm --filter @zhixu/windows exec electron-builder --win nsis --x64 --publish never
      - name: Generate update manifests
        run: node scripts/write-update-manifest.mjs
      - name: Packaged self-test
        shell: pwsh
        run: scripts/run-packaged-self-test.ps1
      - name: Silent install and uninstall
        shell: pwsh
        run: |
          $installer = Get-Item 'release\windows\Zhixu-Setup-*.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP "zhixu-install-$([guid]::NewGuid().ToString('N'))"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") `
            -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)." }
          $application = Get-ChildItem -LiteralPath $installRoot -Filter '*.exe' |
            Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1
          $uninstaller = Get-ChildItem -LiteralPath $installRoot -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $application -or -not $uninstaller) { throw 'Installed application files were not found.' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' `
            -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)." }
          if (Test-Path -LiteralPath $application.FullName) { throw 'Application remained after uninstall.' }
      - name: Validate release assets
        shell: pwsh
        run: |
          $installer = Get-Item 'release\windows\Zhixu-Setup-*.exe'
          if ($installer.Length -le 0) { throw '安装器为空。' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: zhixu-windows
          path: |
            release/windows/Zhixu-Setup-*.exe
            release/windows/Zhixu-Setup-*.exe.sha256
            release/windows/latest.yml
            release/windows/update-manifest.json
