name: Validate and package Windows

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          root_version="$(node -p "require('./package.json').version")"
          windows_version="$(node -p "require('./apps/windows/package.json').version")"
          test -n "$root_version"
          test "$root_version" = "$windows_version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v${root_version}"
          fi
          echo "value=$root_version" >> "$GITHUB_OUTPUT"

  windows:
    needs: metadata
    runs-on: windows-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --manifest-path native/tomatodo_importer/Cargo.toml -- --check
      - run: cargo test --manifest-path native/tomatodo_importer/Cargo.toml
      - run: cargo build --release --manifest-path native/tomatodo_importer/Cargo.toml
      - name: Validate tagged sync configuration
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if (-not $env:SUPABASE_URL -or -not $env:SUPABASE_ANON_KEY) {
            throw 'Tagged builds require SUPABASE_URL and SUPABASE_ANON_KEY secrets.'
          }
      - run: pnpm build:windows
      - name: Build NSIS package
        run: pnpm --filter @zhixu/windows exec electron-builder --win nsis --x64 --publish never
      - name: Generate update manifests
        run: node scripts/write-update-manifest.mjs
      - name: Packaged self-test
        shell: pwsh
        run: scripts/run-packaged-self-test.ps1
      - name: Silent install and uninstall
        shell: pwsh
        run: |
          $installer = Get-Item 'release\windows\Zhixu-Setup-*.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP "zhixu-install-$([guid]::NewGuid().ToString('N'))"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") `
            -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)." }
          $application = Get-ChildItem -LiteralPath $installRoot -Filter '*.exe' |
            Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1
          $uninstaller = Get-ChildItem -LiteralPath $installRoot -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $application -or -not $uninstaller) { throw 'Installed application files were not found.' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' `
            -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)." }
          if (Test-Path -LiteralPath $application.FullName) { throw 'Application remained after uninstall.' }
      - name: Validate release assets
        shell: pwsh
        run: |
          $installer = Get-Item 'release\windows\Zhixu-Setup-*.exe'
          if ($installer.Length -le 0) { throw '安装器为空。' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: zhixu-windows
          path: |
            release/windows/Zhixu-Setup-*.exe
            release/windows/Zhixu-Setup-*.exe.sha256
            release/windows/latest.yml
            release/windows/update-manifest.json

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [metadata, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zhixu-windows
          path: release-assets
      - name: Validate release assets
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          installer="release-assets/Zhixu-Setup-${VERSION}.exe"
          test -s "$installer"
          test -s "${installer}.sha256"
          test -s release-assets/latest.yml
          test -s release-assets/update-manifest.json
          sha256sum --check "${installer}.sha256"
          jq -e --arg version "$VERSION" \
            '.version == $version and .assets.windows.fileName == ("Zhixu-Setup-" + $version + ".exe") and .assets.windows.size > 0' \
            release-assets/update-manifest.json > /dev/null
      - name: Create stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## v${{ needs.metadata.outputs.version }} 稳定版

            - Electron + React Windows 客户端成为当前主版本，保留旧 Flutter 客户端与原数据库兼容路径。
            - 账号登录、邮箱验证、找回密码、首次本地与云端合并及离线同步已启用。
            - 任务、备忘、倒数、日历、专注和睡眠工作区完成统一布局与数据展示改造。
            - 番茄 TODO 历史导入支持预检、纠错、去重和本地日期分组。
            - 安装包暂未接入代码签名，Windows SmartScreen 可能显示未知发布者。
          files: release-assets/*
